[workspace]
resolver = "2"
members = ["crates/*"]
# Plugin examples build for wasm32 in their own workspace.
exclude = ["examples"]
default-members = ["crates/ferrosurf"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FerroApps/FerroSurf"
rust-version = "1.88"

[workspace.dependencies]
ferrosurf-core = { path = "crates/ferrosurf-core" }
ferrosurf-extensions = { path = "crates/ferrosurf-extensions" }
ferrosurf-mcp = { path = "crates/ferrosurf-mcp" }
ferrosurf-passwords = { path = "crates/ferrosurf-passwords" }
ferrosurf-plugins = { path = "crates/ferrosurf-plugins" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
log = "0.4"
parking_lot = "0.12"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "process", "time"] }
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
debug = false
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Fast-to-build optimized profile for local iteration.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
