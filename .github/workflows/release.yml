name: Release

# Publishes a GitHub Release (Linux x86_64 tarball + Windows x86_64 zip, each
# with a .sha256) after every successful "Version" run on main. The bump
# commit that workflow pushes uses GITHUB_TOKEN, which never triggers `push`
# workflows, so this chains off `workflow_run` instead. Re-run manually from
# Actions -> Release -> Run workflow; it skips when release v<Cargo.toml
# version> already exists.
on:
  workflow_run:
    workflows: ["Version"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Oldest supported runner image: the binary links an older glibc and so runs on more distros.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read version and check for an existing release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(.github/scripts/version.sh current)"
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install system libraries
        if: steps.ver.outputs.skip != 'true'
        run: .github/scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
      - name: Build release binary
        if: steps.ver.outputs.skip != 'true'
        run: cargo build --release --locked -p ferrosurf
      - name: Shared libraries of the binary
        if: steps.ver.outputs.skip != 'true'
        run: ldd target/release/ferrosurf
      - name: Package
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          name="ferrosurf-v${VERSION}-linux-x86_64"
          mkdir -p "dist/$name/packaging"
          cp target/release/ferrosurf README.md LICENSE "dist/$name/"
          cp packaging/dev.ferro.ferrosurf.desktop packaging/dev.ferro.ferrosurf.svg \
             packaging/dev.ferro.ferrosurf.metainfo.xml "dist/$name/packaging/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - name: Create GitHub Release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          name="ferrosurf-v${VERSION}-linux-x86_64"
          gh release create "v${VERSION}" --target "$SHA" \
            --title "FerroSurf v${VERSION}" --generate-notes \
            "dist/$name.tar.gz" "dist/$name.tar.gz.sha256"

  # Attaches the Windows x86_64 build to the release created above.
  windows:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Servo prerequisites
        shell: pwsh
        run: ./.github/scripts/install-windows-deps.ps1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p ferrosurf
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $name = "ferrosurf-v$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/ferrosurf.exe, README.md, LICENSE "dist/$name/"
          Get-ChildItem target/release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # sha256sum format ("<hash>  <file>") so `sha256sum -c` also works.
          "$hash  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii
          Get-ChildItem dist
      - name: Upload to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $name = "ferrosurf-v$env:VERSION-windows-x86_64"
          gh release upload "v$env:VERSION" "dist/$name.zip" "dist/$name.zip.sha256" --clobber
