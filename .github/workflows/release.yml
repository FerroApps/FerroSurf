name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Servo prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld cmake pkg-config python3 python3-pip curl git \
            libssl-dev libdbus-1-dev libudev-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # See ci.yml for the rationale behind the Windows/MozillaBuild setup.
      - name: Install Servo prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y llvm make nasm --no-progress
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.0.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\MozillaBuildSetup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait
          if (-not (Test-Path "C:\mozilla-build")) { throw "MozillaBuild install failed" }
          "MOZILLABUILD=C:\mozilla-build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOZTOOLS_PATH=C:\mozilla-build\msys2\usr\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build release
        run: cargo build --release -p ferrosurf

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          D=ferrosurf-${{ steps.ver.outputs.v }}-linux-x86_64
          mkdir -p "$D"
          cp target/release/ferrosurf "$D/"
          cp -r crates/ferrosurf/resources "$D/resources"
          cp packaging/linux/org.ferroapps.FerroSurf.* "$D/"
          cp packaging/linux/install.sh "$D/install.sh"
          sed -i 's#ROOT="$(cd "$HERE/../.." \&\& pwd)"#ROOT="$HERE"#' "$D/install.sh"
          tar czf "$D.tar.gz" "$D"
          echo "ASSET=$D.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          $d = "ferrosurf-$v-windows-x86_64"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target\release\ferrosurf.exe $d\
          Get-ChildItem target\release\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $d\
          Copy-Item -Recurse crates\ferrosurf\resources "$d\resources"
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          choco install -y innosetup --no-progress
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          ./packaging/windows/build-installer.ps1 -Version $v -SkipBuild
          "ASSET=$d.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            ${{ env.ASSET }}
            dist/*-setup.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
