# Example plugins: a separate workspace, built for wasm32-unknown-unknown:
#   cargo build --release --target wasm32-unknown-unknown
# (or `./build.sh`, which also lays them out as installable plugin folders).
[workspace]
resolver = "3"
members = ["privacy-redirects", "quick-notes", "gh-omnibox"]

[workspace.dependencies]
ferrosurf-plugin-sdk = { path = "../../crates/ferrosurf-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
