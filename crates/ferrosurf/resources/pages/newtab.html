<!doctype html>
<html lang="es" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nueva pestaña</title>
<style>
:root{--accent:{{ACCENT}};--bg:#14161b;--bg2:#1c1f26;--fg:#e9eaee;--mute:#8b909c;--card:#1f232b;--card-h:#2a2f39;--line:#2d323c}
html[data-theme="light"]{--bg:#f6f3f0;--bg2:#ffffff;--fg:#1d2026;--mute:#6b707b;--card:#ffffff;--card-h:#f0ebe6;--line:#e2dcd6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;background:var(--accent);opacity:.16;filter:blur(90px)}
html[data-theme="light"] .bg i{opacity:.18}
.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-14vw;animation:d1 22s ease-in-out infinite alternate}
.bg i:nth-child(2){width:38vw;height:38vw;right:-12vw;bottom:-14vw;animation:d2 26s ease-in-out infinite alternate;opacity:.1}
@keyframes d1{to{transform:translate(12vw,10vh) scale(1.2)}}
@keyframes d2{to{transform:translate(-14vw,-8vh) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:9vh 24px 40px}
.clock{font-size:clamp(56px,10vw,104px);font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.greet{margin:12px 0 34px;font-size:20px;color:var(--mute)}
.greet b{color:var(--accent);font-weight:600}
form{width:100%;max-width:620px;position:relative}
input{width:100%;height:54px;border-radius:27px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:17px;padding:0 24px 0 52px;outline:none;box-shadow:0 8px 30px rgba(0,0,0,.18)}
input::placeholder{color:var(--mute)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,106,61,.22),0 8px 30px rgba(0,0,0,.18)}
form svg{position:absolute;left:20px;top:16px;width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
kbd{position:absolute;right:18px;top:15px;font:12px ui-monospace,monospace;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 8px;pointer-events:none}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:46px 0 14px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,108px);gap:14px;justify-content:center;max-width:820px;width:100%}
a.t{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:13px;transition:transform .15s,background .15s,border-color .15s}
a.t:hover,a.t:focus{background:var(--card-h);transform:translateY(-3px);border-color:var(--accent);outline:none}
.av{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff}
.t span{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:820px}
a.b{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:13px;max-width:200px}
a.b:hover,a.b:focus{border-color:var(--accent);outline:none}
a.b .av{width:22px;height:22px;border-radius:50%;font-size:12px;flex:none}
a.b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin-top:auto;padding-top:48px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:13px;color:var(--mute);border:1px solid var(--line);background:var(--bg2)}
.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.chip b{color:var(--fg);font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<main>
  <div class="clock" id="clock">--:--</div>
  <div class="greet" id="greet"></div>
  <form id="f" autocomplete="off">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8b909c" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" fill="none" stroke="#8b909c"/><path d="M20 20l-4-4" stroke="#8b909c"/></svg>
    <input id="q" type="text" spellcheck="false" autofocus>
    <kbd>/</kbd>
  </form>
  <h2 id="h-top">Sitios frecuentes</h2>
  <div class="grid" id="top"></div>
  <h2 id="h-bm">Marcadores</h2>
  <div class="bm" id="bm"></div>
  <div class="hint"><span class="chip">Asistente IA &middot; Pulsa <b>Ctrl+J</b> para abrir el asistente IA</span></div>
</main>
<script>
const SEARCH_NAME="{{SEARCH_NAME}}",SEARCH_URL="{{SEARCH_URL}}",NAME="{{GREETING_NAME}}";
const TOP={{TOP_SITES_JSON}},BMS={{BOOKMARKS_JSON}};
const $=id=>document.getElementById(id);
function tick(){const d=new Date(),h=d.getHours();
 $("clock").textContent=String(h).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
 const g=h>=6&&h<13?"Buenos días":h>=13&&h<21?"Buenas tardes":"Buenas noches";
 $("greet").innerHTML="";$("greet").append(g);
 if(NAME&&NAME.indexOf("{{")!==0){const b=document.createElement("b");b.textContent=", "+NAME;$("greet").append(b)}}
tick();setInterval(tick,10000);
$("q").placeholder="Buscar con "+SEARCH_NAME+" o escribir una dirección";
function looksLikeUrl(s){if(/\s/.test(s))return false;if(/^[a-z][a-z0-9+.-]*:\/\//i.test(s)||/^(about|file|data|ferrosurf):/i.test(s))return true;
 return /^(localhost|(\d{1,3}\.){3}\d{1,3})(:\d+)?([\/?#].*)?$/i.test(s)||/^[^\/?#.]+(\.[^\/?#.]+)+(:\d+)?([\/?#].*)?$/.test(s)&&/\.[a-z]{2,}(:\d+)?([\/?#]|$)/i.test(s)}
$("f").addEventListener("submit",e=>{e.preventDefault();const v=$("q").value.trim();if(!v)return;
 let u;if(looksLikeUrl(v))u=/^(https?|file|about|data|ferrosurf):/i.test(v)?v:(/^(localhost|\d)/i.test(v)?"http://":"https://")+v;
 else u=SEARCH_URL.replace("{searchTerms}",encodeURIComponent(v));
 location.href=u});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("q")&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();$("q").focus();$("q").select()}});
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(_){return u}}
function avatar(t,u){const h=host(u);let n=0;for(let i=0;i<h.length;i++)n=(n*31+h.charCodeAt(i))>>>0;
 const d=document.createElement("div");d.className="av";d.style.background="hsl("+(n%360)+",55%,46%)";
 d.textContent=((t||h).trim()[0]||"?").toUpperCase();return d}
function fill(id,list,cls,hid){const el=$(id);if(!Array.isArray(list)||!list.length){el.classList.add("hide");$(hid).classList.add("hide");return}
 list.forEach(s=>{const a=document.createElement("a");a.className=cls;a.href=s.url;a.title=s.url;
 const sp=document.createElement("span");sp.textContent=s.title||host(s.url);a.append(avatar(s.title,s.url),sp);el.append(a)})}
fill("top",TOP,"t","h-top");fill("bm",BMS,"b","h-bm");
</script>
</body>
</html>
