[package]
name = "ferrosurf-plugins"
description = "FerroSurf native plugin host: WebAssembly plugins on wasmi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrosurf-plugin-sdk = { path = "../ferrosurf-plugin-sdk", default-features = false }
ferrosurf-extensions.workspace = true
ferrosurf-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
log.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
toml = "0.9"
# Same interpreter and features as Ferrocord: lazy translation, fuel, no JIT.
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate", "auto-dispatch"] }
rusqlite = { version = "0.38", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
wat = "1"
